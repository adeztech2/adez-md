services:
  - type: web
    name: arnoldadezbot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PREFIX
        value: "."
      - key: BOT_NAME
        value: ADEZ MD
      - key: MODE
        value: public
      - key: OWNER_NUMBER
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
