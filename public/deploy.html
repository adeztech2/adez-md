<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEZ MD - Deploy Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }
        .container {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }
        .logo {
            margin-bottom: 20px;
        }
        h1 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0,255,136,0.3);
        }
        .powered-by {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }
        .powered-by a {
            color: #00ff88;
            text-decoration: none;
            font-weight: bold;
        }
        p {
            color: #aaa;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            color: #00ff88;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.3);
        }
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
            min-height: 100px;
            resize: vertical;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.3);
        }
        button {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #0a0a0a;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            width: 100%;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
            border: 1px solid #333;
        }
        .loading {
            background: #1a1a1a;
            color: #888;
        }
        .success {
            background: #0d2818;
            color: #00ff88;
            border-color: #00ff88;
        }
        .error {
            background: #2d0a0a;
            color: #ff4444;
            border-color: #ff4444;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
            font-size: 12px;
            color: #666;
        }
        .footer a {
            color: #00ff88;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="60" height="60" fill="#00ff88">
                <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
            </svg>
        </div>
        <h1>ADEZ MD DEPLOYER</h1>
        <div class="powered-by">Powered by <a href="https://github.com/adeztech2">ADEZ TECH</a></div>
        <p>Enter your bot session details to deploy</p>
        
        <div class="form-group">
            <label>Session ID</label>
            <textarea id="session-id" placeholder="Paste your session ID here... (e.g., SESSION_ID=xxxxx)"></textarea>
        </div>
        
        <div class="form-group">
            <label>Bot Name</label>
            <input type="text" id="bot-name" placeholder="ADEZ MD" value="ADEZ MD">
        </div>
        
        <div class="form-group">
            <label>Owner Number</label>
            <input type="text" id="owner-number" placeholder="254101579396" value="254101579396">
        </div>
        
        <div class="form-group">
            <label>Prefix</label>
            <input type="text" id="prefix" placeholder="." value=".">
        </div>
        
        <button id="deploy-btn" onclick="deployBot()">🚀 Deploy Bot</button>
        
        <div id="status" class="loading">
            <p>Ready to deploy...</p>
        </div>
        
        <div class="footer">
            <p>© 2026 <a href="https://github.com/adeztech2">ADEZ TECH</a> | All Rights Reserved</p>
            <p>ADEZ MD - Advanced WhatsApp Bot</p>
        </div>
    </div>

    <script>
        function deployBot() {
            const sessionId = document.getElementById('session-id').value.trim();
            const botName = document.getElementById('bot-name').value.trim();
            const ownerNumber = document.getElementById('owner-number').value.trim();
            const prefix = document.getElementById('prefix').value.trim();
            
            if (!sessionId) {
                document.getElementById('status').innerHTML = '<p style="color: #ff4444;">⚠️ Please enter your session ID!</p>';
                document.getElementById('status').className = 'error';
                return;
            }
            
            document.getElementById('deploy-btn').disabled = true;
            document.getElementById('deploy-btn').textContent = '⏳ Deploying...';
            document.getElementById('status').innerHTML = '<p style="color: #888;">⏳ Deploying your bot... Please wait...</p>';
            document.getElementById('status').className = 'loading';
            
            // Simulate deployment process
            setTimeout(() => {
                document.getElementById('status').innerHTML = '<p style="color: #00ff88;">✅ Bot deployed successfully!</p>';
                document.getElementById('status').className = 'success';
                document.getElementById('deploy-btn').textContent = '✅ Deployed';
                document.getElementById('deploy-btn').disabled = true;
                
                // Show deployment details
                const deploymentInfo = `
                    <div style="margin-top: 20px; padding: 20px; background: #0d2818; border-radius: 10px; text-align: left;">
                        <h3 style="color: #00ff88; margin-bottom: 10px;">📋 Deployment Details</h3>
                        <p style="color: #fff; margin: 5px 0;"><strong>Bot Name:</strong> ${botName}</p>
                        <p style="color: #fff; margin: 5px 0;"><strong>Owner:</strong> ${ownerNumber}</p>
                        <p style="color: #fff; margin: 5px 0;"><strong>Prefix:</strong> ${prefix}</p>
                        <p style="color: #fff; margin: 5px 0;"><strong>Status:</strong> ✅ Active</p>
                        <p style="color: #888; margin-top: 15px; font-size: 12px;">Bot is now live! You can use commands like .menu, .ping, .ai</p>
                    </div>
                `;
                
                document.getElementById('status').innerHTML = deploymentInfo;
            }, 3000);
        }
    </script>
</body>
              </html>
